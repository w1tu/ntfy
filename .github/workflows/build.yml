name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: Debug build (writes /var/mobile/Library/Caches/ntfy-debug.log)
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        scheme: [rootless, rootful]
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5
        with:
          path: ntfy

      - name: Install Theos
        run: |
          brew install ldid make xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          git -C sdks sparse-checkout set iPhoneOS16.5.sdk
          cp -R sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build ${{ matrix.scheme }} package (arm64 + arm64e)
        working-directory: ntfy
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          scheme="${{ matrix.scheme }}"
          [ "$scheme" = rootful ] && scheme=""
          if [ "${{ inputs.debug }}" = "true" ]; then
            make package DEBUG=1 THEOS_PACKAGE_SCHEME="$scheme"
          else
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$scheme"
          fi

      - name: Verify package
        working-directory: ntfy
        run: |
          for binary in $(find .theos/_ -name ntfy.dylib -o -path '*ntfyPrefs.bundle/ntfyPrefs'); do
            lipo -info "$binary"
          done
          ls -l packages/

      - uses: actions/upload-artifact@v5
        with:
          name: ntfy-${{ matrix.scheme }}
          path: ntfy/packages/*.deb
